<svg width="1200" height="540" viewBox="0 0 1200 540"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!-- GRADIENTS -->
    <!-- ================================================= -->

    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22E0E0"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <radialGradient id="ambient"
                    cx="50%" cy="38%" r="75%">
      <stop offset="0%"
            stop-color="#312E81"
            stop-opacity="0.22"/>
      <stop offset="55%"
            stop-color="#111827"
            stop-opacity="0.05"/>
      <stop offset="100%"
            stop-color="#05070D"
            stop-opacity="0"/>
    </radialGradient>

    <!-- ================================================= -->
    <!-- GRID -->
    <!-- ================================================= -->

    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">

      <path d="M30 0H0V30"
            fill="none"
            stroke="#182033"
            stroke-width="1"
            opacity="0.50"/>

    </pattern>

    <!-- ================================================= -->
    <!-- GLOW FILTERS -->
    <!-- ================================================= -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="4"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter id="softGlow"
            x="-150%"
            y="-150%"
            width="400%"
            height="400%">

      <feGaussianBlur stdDeviation="9"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="540"
        rx="30"
        fill="#05070D"/>

  <rect width="1200"
        height="540"
        rx="30"
        fill="url(#ambient)"/>

  <rect width="1200"
        height="540"
        rx="30"
        fill="url(#grid)"
        opacity="0.45"/>


  <!-- ================================================= -->
  <!-- AMBIENT PARTICLES -->
  <!-- ================================================= -->

  <g fill="#94A3B8">

    <circle cx="85" cy="100" r="1.5">
      <animate
        attributeName="opacity"
        values="0.10;0.80;0.10"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="180" cy="145" r="1.3">
      <animate
        attributeName="opacity"
        values="0.75;0.12;0.75"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1025" cy="100" r="1.5">
      <animate
        attributeName="opacity"
        values="0.12;0.75;0.12"
        dur="4.6s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1110" cy="150" r="1.3">
      <animate
        attributeName="opacity"
        values="0.75;0.12;0.75"
        dur="5.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1045" cy="405" r="1.2">
      <animate
        attributeName="opacity"
        values="0.12;0.70;0.12"
        dur="4.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="130" cy="410" r="1.2">
      <animate
        attributeName="opacity"
        values="0.70;0.12;0.70"
        dur="5.4s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================================= -->
  <!-- TOP BAR -->
  <!-- ================================================= -->

  <text x="48"
        y="48"
        fill="#22E0E0"
        font-family="ui-monospace, Menlo, monospace"
        font-size="13"
        font-weight="600"
        letter-spacing="2">

    AI ENGINEERING / ACTIVE

  </text>

  <circle cx="265"
          cy="43"
          r="4.5"
          fill="#22C55E"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>

  <text x="1152"
        y="48"
        text-anchor="end"
        fill="#64748B"
        font-family="ui-monospace, Menlo, monospace"
        font-size="13"
        font-weight="600"
        letter-spacing="1.8">

    BUILD • ORCHESTRATE • SHIP

  </text>


  <!-- ================================================= -->
  <!-- MAIN IDENTITY -->
  <!-- ================================================= -->

  <text x="600"
        y="122"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="76"
        font-weight="700"
        letter-spacing="4">

    RANAJIT DHAR

  </text>


  <!-- Accent divider -->
  <line x1="300"
        y1="150"
        x2="900"
        y2="150"
        stroke="url(#accent)"
        stroke-width="2.5"
        opacity="0.72"/>

  <circle cx="600"
          cy="150"
          r="6"
          fill="#22E0E0"
          filter="url(#glow)">

    <animate
      attributeName="r"
      values="5;10;5"
      dur="2s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="1;0.30;1"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- MAIN ROLE -->
  <!-- ================================================= -->

  <text x="600"
        y="195"
        text-anchor="middle"
        fill="url(#accent)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="700"
        letter-spacing="4">

    GENAI ENGINEER · AI SYSTEMS ARCHITECT

  </text>


  <!-- ================================================= -->
  <!-- DESCRIPTION -->
  <!-- ================================================= -->

  <text x="600"
        y="229"
        text-anchor="middle"
        fill="#A0A9C0"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17">

    Building resilient AI systems, multi-agent applications

  </text>

  <text x="600"
        y="255"
        text-anchor="middle"
        fill="#A0A9C0"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17">

    &amp; cloud-deployed GenAI solutions.

  </text>


  <!-- ================================================= -->
  <!-- PIPELINE BACKBONE -->
  <!-- ================================================= -->

  <line x1="95"
        y1="340"
        x2="1105"
        y2="340"
        stroke="#1B2539"
        stroke-width="4"/>

  <line x1="95"
        y1="340"
        x2="1105"
        y2="340"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-dasharray="13 23"
        opacity="0.62">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-210"
      dur="3s"
      repeatCount="indefinite"/>

  </line>


  <!-- ================================================= -->
  <!-- INPUT -->
  <!-- ================================================= -->

  <g>

    <rect x="45"
          y="292"
          width="180"
          height="96"
          rx="15"
          fill="#080D18"
          stroke="#2A3650"
          stroke-width="1.6"/>

    <text x="135"
          y="320"
          text-anchor="middle"
          fill="#71809F"
          font-family="ui-monospace, Menlo, monospace"
          font-size="13"
          font-weight="600"
          letter-spacing="2.2">

      INPUT

    </text>

    <text x="135"
          y="356"
          text-anchor="middle"
          fill="#F1F5F9"
          font-family="Arial, Helvetica, sans-serif"
          font-size="21"
          font-weight="600">

      Prompt

    </text>

    <circle cx="225"
            cy="340"
            r="6"
            fill="#22E0E0"
            filter="url(#glow)">

      <animate
        attributeName="r"
        values="5;10;5"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- REASON -->
  <!-- ================================================= -->

  <g>

    <rect x="245"
          y="292"
          width="180"
          height="96"
          rx="15"
          fill="#080D18"
          stroke="#2A3650"
          stroke-width="1.6"/>

    <text x="335"
          y="320"
          text-anchor="middle"
          fill="#71809F"
          font-family="ui-monospace, Menlo, monospace"
          font-size="13"
          font-weight="600"
          letter-spacing="2.2">

      REASON

    </text>

    <text x="335"
          y="356"
          text-anchor="middle"
          fill="#F1F5F9"
          font-family="Arial, Helvetica, sans-serif"
          font-size="21"
          font-weight="600">

      Agents

    </text>

  </g>


  <!-- ================================================= -->
  <!-- WIDER CONTROL CORE -->
  <!-- ================================================= -->

  <g>

    <rect x="435"
          y="270"
          width="330"
          height="140"
          rx="20"
          fill="#0A0F1F"
          stroke="url(#accent)"
          stroke-width="2"/>


    <!-- Pulse ring -->

    <circle cx="600"
            cy="322"
            r="31"
            fill="none"
            stroke="url(#accent)"
            stroke-width="1.5"
            opacity="0.6">

      <animate
        attributeName="r"
        values="27;39;27"
        dur="3s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0.65;0.05;0.65"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Core -->

    <circle cx="600"
            cy="322"
            r="21"
            fill="#070B14"
            stroke="#8B5CF6"
            stroke-width="2"
            filter="url(#glow)"/>

    <circle cx="600"
            cy="322"
            r="8"
            fill="#22E0E0"
            filter="url(#glow)">

      <animate
        attributeName="r"
        values="7;13;7"
        dur="1.8s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Core caption -->

    <text x="600"
          y="365"
          text-anchor="middle"
          fill="#F8FAFC"
          font-family="ui-monospace, Menlo, monospace"
          font-size="14"
          font-weight="700"
          letter-spacing="2.1">

      AI ROUTER / CONTROL CORE

    </text>

    <text x="600"
          y="388"
          text-anchor="middle"
          fill="#75819A"
          font-family="ui-monospace, Menlo, monospace"
          font-size="11.5"
          font-weight="600"
          letter-spacing="1.5">

      SMART · MANUAL · FAILOVER

    </text>

  </g>


  <!-- ================================================= -->
  <!-- EXECUTE -->
  <!-- ================================================= -->

  <g>

    <rect x="785"
          y="292"
          width="180"
          height="96"
          rx="15"
          fill="#080D18"
          stroke="#2A3650"
          stroke-width="1.6"/>

    <text x="875"
          y="320"
          text-anchor="middle"
          fill="#71809F"
          font-family="ui-monospace, Menlo, monospace"
          font-size="13"
          font-weight="600"
          letter-spacing="2.2">

      EXECUTE

    </text>

    <text x="875"
          y="356"
          text-anchor="middle"
          fill="#F1F5F9"
          font-family="Arial, Helvetica, sans-serif"
          font-size="20"
          font-weight="600">

      LLM Provider

    </text>

  </g>


  <!-- ================================================= -->
  <!-- OUTPUT -->
  <!-- ================================================= -->

  <g>

    <rect x="985"
          y="292"
          width="170"
          height="96"
          rx="15"
          fill="#080D18"
          stroke="#2A3650"
          stroke-width="1.6"/>

    <text x="1070"
          y="320"
          text-anchor="middle"
          fill="#71809F"
          font-family="ui-monospace, Menlo, monospace"
          font-size="13"
          font-weight="600"
          letter-spacing="2.2">

      OUTPUT

    </text>

    <text x="1070"
          y="356"
          text-anchor="middle"
          fill="#F1F5F9"
          font-family="Arial, Helvetica, sans-serif"
          font-size="21"
          font-weight="600">

      Response

    </text>

    <circle cx="985"
            cy="340"
            r="6"
            fill="#D946EF"
            filter="url(#glow)">

      <animate
        attributeName="r"
        values="5;10;5"
        dur="2s"
        begin="1s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- MOVING DATA PACKETS -->
  <!-- ================================================= -->

  <circle r="4.5"
          fill="#22E0E0"
          filter="url(#glow)">

    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      path="M95 340 L1105 340"/>

  </circle>


  <circle r="3.7"
          fill="#8B5CF6"
          filter="url(#glow)">

    <animateMotion
      dur="4s"
      begin="1.4s"
      repeatCount="indefinite"
      path="M95 340 L1105 340"/>

  </circle>


  <circle r="3.7"
          fill="#D946EF"
          filter="url(#glow)">

    <animateMotion
      dur="4s"
      begin="2.6s"
      repeatCount="indefinite"
      path="M95 340 L1105 340"/>

  </circle>


  <!-- ================================================= -->
  <!-- CAPABILITY STRIP -->
  <!-- ================================================= -->

  <rect x="70"
        y="430"
        width="1060"
        height="72"
        rx="16"
        fill="#080C16"
        stroke="#202A3F"
        stroke-width="1.3"/>


  <text x="175"
        y="474"
        text-anchor="middle"
        fill="#22E0E0"
        font-family="ui-monospace, Menlo, monospace"
        font-size="12"
        font-weight="600"
        letter-spacing="1.5">

    GENAI

  </text>


  <text x="390"
        y="474"
        text-anchor="middle"
        fill="#A5B4FC"
        font-family="ui-monospace, Menlo, monospace"
        font-size="12"
        font-weight="600"
        letter-spacing="1.5">

    ORCHESTRATION

  </text>


  <text x="600"
        y="474"
        text-anchor="middle"
        fill="#C4B5FD"
        font-family="ui-monospace, Menlo, monospace"
        font-size="12"
        font-weight="600"
        letter-spacing="1.5">

    AI INFRA

  </text>


  <text x="815"
        y="474"
        text-anchor="middle"
        fill="#67E8F9"
        font-family="ui-monospace, Menlo, monospace"
        font-size="12"
        font-weight="600"
        letter-spacing="1.5">

    CLOUD DEPLOYMENT

  </text>


  <text x="1030"
        y="474"
        text-anchor="middle"
        fill="#F0ABFC"
        font-family="ui-monospace, Menlo, monospace"
        font-size="12"
        font-weight="600"
        letter-spacing="1.5">

    DEVSECOPS

  </text>


  <!-- Capability separators -->

  <g stroke="#1E293B"
     stroke-width="1">

    <line x1="285"
          y1="446"
          x2="285"
          y2="486"/>

    <line x1="495"
          y1="446"
          x2="495"
          y2="486"/>

    <line x1="705"
          y1="446"
          x2="705"
          y2="486"/>

    <line x1="925"
          y1="446"
          x2="925"
          y2="486"/>

  </g>


  <!-- ================================================= -->
  <!-- OUTER FRAME -->
  <!-- ================================================= -->

  <rect x="1.5"
        y="1.5"
        width="1197"
        height="537"
        rx="30"
        fill="none"
        stroke="#252C3E"
        stroke-width="1.5"/>

</svg>
